project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "outputs/*.qmd"
    - "!outputs/palettes.qmd"

website:
  title: Embla
  search: false
  navbar:
    left:
      - href: index.qmd
        text: Overview
      - href: outputs/index.qmd
        text: Plot Demo
      - href: usage.qmd
        text: Usage Tutorial

  sidebar:
    - id: overview
      title: "Pages"
      style: docked
      collapse-level: 2
      contents:
        - text: "Overview"
          href: index.qmd
    - id: outputs
      title: "Pages"
      style: docked
      collapse-level: 2
      contents:
        - text: "Overview"
          href: outputs/index.qmd
        - text: "Lines"
          href: outputs/lines.qmd
        - text: "Bars and markers"
          href: outputs/bars.qmd
        - text: "Heatmaps"
          href: outputs/heatmaps.qmd
        - text: "Table"
          href: outputs/table.qmd
        - text: "3D"
          href: outputs/three-d.qmd
        - text: "Diagrams"
          href: outputs/diagrams.qmd
        - text: "Colors"
          href: outputs/themes.qmd

lang: en

format:
  askr-html:
    include-after-body: outputs/quantum-view.html
    toc: true
    toc-title: "Sections"
    toc-location: right
    code-copy: true
    code-fold: true
    code-summary: "Source"
    code-overflow: wrap
    smooth-scroll: true

execute:
  echo: true
  warning: false
